<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Watermark Toolkit</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <nav class="modes" aria-label="Mode">
      <button id="singleMode" class="mode active" type="button">Single</button>
      <button id="bulkMode" class="mode" type="button">Bulk</button>
    </nav>

    <h1>Watermark Toolkit</h1>

    <label id="dropZone" class="drop-zone" for="fileInput">
      <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" hidden>
      <span id="uploadLabel">Choose image</span>
    </label>

    <section id="workspace" class="workspace hidden">
      <div id="singlePreview">
        <div id="previewWrap" class="preview">
          <canvas id="beforeCanvas" aria-label="Original"></canvas>
          <canvas id="afterCanvas" class="after" aria-label="Processed"></canvas>
          <div id="splitLine" class="split" aria-hidden="true"></div>
        </div>
        <input id="compareSlider" class="slider" type="range" min="0" max="100" value="50" aria-label="Compare original and processed">
      </div>

      <div id="bulkPreview" class="bulk-preview hidden" aria-label="Bulk preview"></div>
      <button id="downloadButton" class="download" type="button">Download</button>
    </section>

    <div class="settings">
      <select id="metadataMode" aria-label="Metadata">
        <option value="set" selected>Set metadata</option>
        <option value="strip">Strip metadata</option>
      </select>
      <input id="locationName" value="Tel Aviv, Israel" aria-label="Location" placeholder="Location">
      <input id="latitude" type="number" step="any" value="32.0853" aria-label="Latitude" placeholder="Latitude">
      <input id="longitude" type="number" step="any" value="34.7818" aria-label="Longitude" placeholder="Longitude">
      <select id="devicePreset" aria-label="Device">
        <option value="iphone17pro" selected>iPhone 17 Pro</option>
        <option value="fold7">Samsung Galaxy Z Fold7</option>
        <option value="sonya7iv">Sony α7 IV</option>
        <option value="canonr5">Canon EOS R5</option>
        <option value="custom">Custom</option>
      </select>
      <input id="customMake" class="hidden" aria-label="Make" placeholder="Make">
      <input id="customModel" class="hidden" aria-label="Model" placeholder="Model">
    </div>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
