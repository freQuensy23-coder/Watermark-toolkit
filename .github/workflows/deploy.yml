name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Prepare pinned runtime assets
        run: npm run prepare-assets

      - name: Deploy production Worker
        id: production
        if: ${{ env.DEPLOY_CF_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.DEPLOY_CF_API_TOKEN }}
          accountId: ${{ env.DEPLOY_CF_ACCOUNT_ID }}
          wranglerVersion: 4.125.0
          command: deploy

      - name: Smoke test production Worker
        if: ${{ env.DEPLOY_CF_API_TOKEN != '' }}
        env:
          DEPLOYMENT_URL: ${{ steps.production.outputs.deployment-url }}
        run: |
          URL="$(printf '%s' "$DEPLOYMENT_URL" | sed 's/ .*//')"
          case "$URL" in http*) ;; *) URL="https://$URL" ;; esac
          ok=0
          for i in $(seq 1 10); do
            if curl --fail --silent --show-error "$URL" | grep -q "Gemini watermark remover"; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          curl --fail --silent --show-error "$URL/app.js" | grep -q "gemini-diamond-96px.png"
          test "$(curl --fail --silent --show-error "$URL/assets/gemini-diamond-96px.png" | wc -c)" -gt 3000
          echo "Production smoke tests passed: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy temporary Worker when Cloudflare secret is not configured
        if: ${{ env.DEPLOY_CF_API_TOKEN == '' }}
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: npx -y wrangler@4.125.0 deploy --temporary | tee "$RUNNER_TEMP/wrangler.log"

      - name: Smoke test temporary Worker
        if: ${{ env.DEPLOY_CF_API_TOKEN == '' }}
        run: |
          URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/wrangler.log" | tail -1)"
          test -n "$URL"
          ok=0
          for i in $(seq 1 10); do
            if curl --fail --silent --show-error "$URL" | grep -q "Gemini watermark remover"; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          curl --fail --silent --show-error "$URL/app.js" | grep -q "gemini-diamond-96px.png"
          test "$(curl --fail --silent --show-error "$URL/assets/gemini-diamond-96px.png" | wc -c)" -gt 3000
          echo "Temporary smoke tests passed: $URL" >> "$GITHUB_STEP_SUMMARY"
