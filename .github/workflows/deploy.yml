name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Test
        run: npm test
      - name: Trigger authenticated Cloudflare deployment
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          AUDIENCE: watermark-toolkit-cd
        run: |
          TOKEN_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")"
          OIDC_TOKEN="$(node -e "const x=JSON.parse(process.argv[1]); if(!x.value) process.exit(1); process.stdout.write(x.value)" "$TOKEN_JSON")"
          DEPLOY_RESPONSE="$(curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "X-GitHub-Sha: $GITHUB_SHA" \
            https://watermark-toolkit.pages.dev/__deploy)"
          DEPLOY_URL="$(node -e "const x=JSON.parse(process.argv[1]); if(!x.ok || !x.deployment?.url) process.exit(1); process.stdout.write(x.deployment.url)" "$DEPLOY_RESPONSE")"
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
      - name: Verify deployed commit and Worker runtime
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          verify_url() {
            base="$1"
            ok=0
            for i in $(seq 1 60); do
              headers="$(mktemp)"
              build="$(curl --fail --silent --show-error -D "$headers" "$base/build.json" 2>/dev/null || true)"
              if printf '%s' "$build" | grep -q "$GITHUB_SHA" && grep -qi '^x-watermark-toolkit-worker: 1' "$headers"; then
                ok=1
                rm -f "$headers"
                break
              fi
              rm -f "$headers"
              sleep 2
            done
            test "$ok" = 1
          }
          verify_url "$DEPLOY_URL"
          verify_url "https://watermark-toolkit.pages.dev"
          curl --fail --silent --show-error https://watermark-toolkit.pages.dev/ | grep -q 'Watermark Toolkit'
          curl --fail --silent --show-error https://watermark-toolkit.pages.dev/app.js | grep -q 'Download ZIP'
