name: Provision production Workers

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/provision.yml

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOOTSTRAP_URL: https://watermark-toolkit-bootstrap.spotty-braid.workers.dev
    steps:
      - name: Diagnose bootstrap route
        run: |
          curl --silent --show-error --include "$BOOTSTRAP_URL/bootstrap" || true
