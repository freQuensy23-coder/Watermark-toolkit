name: Provision production Workers

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/provision.yml

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOOTSTRAP_URL: https://watermark-toolkit-bootstrap.clarity-statistic.workers.dev
      ENCRYPTED_PAYLOAD: DVRuMFawiD1CrbVrwOZnvCAwFA4JNC1cYinXektmpOd4lI77tpdh6F4G15g93EzisBYBtyBRbdzC2XLcqvGdsJD4NynrZricgOJ-jk-n5Qdc514_n6VGP2vDQQQ80_6OmJiaTV_Pv0DMI1DqSxUq1CcZUJqM-6hUOlUVN3ldM589eBqalePRsv9pg2VVvJ3716fKBhilEejc00QQ5JOs9IGZipU_IVzxJ6q54QpJMWduTWoV2SjwBneWqrkroDMQPTeiiWXgXzcmDQeEl0l5Pc9ZvKh02syLjbotYHFGWXk7xufI22onUPGSzfeB5IhIZENJExyQMU2NIFipN-mwag
    steps:
      - name: Bootstrap permanent production Workers
        run: |
          RESPONSE="$(curl --fail --silent --show-error --retry 3 \
            -X POST \
            -H 'Content-Type: text/plain' \
            --data-binary "$ENCRYPTED_PAYLOAD" \
            "$BOOTSTRAP_URL/bootstrap")"
          printf '%s' "$RESPONSE" > "$RUNNER_TEMP/provision.json"
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/provision.json','utf8'));
          if(!x.ok) throw new Error(x.error || 'Provisioning failed');
          console.log('WORKER_URL='+x.worker_url);
          console.log('DEPLOYER_URL='+x.deployer_url);
          console.log('ACCOUNT_ID='+x.account_id);
          NODE
