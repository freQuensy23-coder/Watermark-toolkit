name: Apply bulk preview fix
on:
  push:
    branches: [main]
    paths:
      - scripts/patch-bulk-preview.mjs
      - .github/workflows/patch-bulk-preview.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply patch and test
        run: |
          node scripts/patch-bulk-preview.mjs
          npm test
      - name: Commit fix and remove one-time patch files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add public/app.js tests/test.mjs
          git rm scripts/patch-bulk-preview.mjs .github/workflows/patch-bulk-preview.yml
          git commit -m 'fix: render every bulk preview and move metadata controls down'
          git push
